services:
  pgvector:
    build:
      context: ./docker/pgvector
    environment:
      POSTGRES_DB: naturalist
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d naturalist"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: .
    environment:
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:postgres@pgvector:5432/naturalist}
      INATURALIST_API_BASE_URL: ${INATURALIST_API_BASE_URL:-https://api.inaturalist.org/v1}
    ports:
      - "3000:3000"
    depends_on:
      pgvector:
        condition: service_healthy

volumes:
  pgvector_data:
